<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frost Admin</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--line:#262c36;--txt:#e6e9ef;--mut:#8b94a3;--acc:#4da3ff;--bad:#ff5d5d;--ok:#3ecf8e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;flex:1}
input,select,button{background:#0e1116;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit}
button{cursor:pointer;background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:600}
button.sec{background:transparent;color:var(--txt);border-color:var(--line)}
button.bad{background:var(--bad);border-color:var(--bad);color:#200}
main{display:grid;grid-template-columns:300px 1fr;gap:12px;padding:12px;height:calc(100vh - 54px)}
.col{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.card h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.row>input,.row>select{flex:1;min-width:90px}
#list{overflow:auto;flex:1}
.p{padding:8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.p:hover,.p.sel{background:#202632}
.tag{font-size:11px;padding:1px 6px;border-radius:9px;border:1px solid var(--line);color:var(--mut)}
.tag.on{color:var(--ok);border-color:var(--ok)}.tag.ban{color:var(--bad);border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
#log{background:#000;color:#b7f5c8;font:12px/1.4 ui-monospace,Consolas,monospace;padding:10px;border-radius:8px;height:170px;overflow:auto;white-space:pre-wrap}
#login{position:fixed;inset:0;background:var(--bg);display:none;place-items:center}
#login .card{width:320px}
.mut{color:var(--mut)}
@media(max-width:800px){main{grid-template-columns:1fr;height:auto}}
</style>
</head>
<body>
<div id="login"><div class="card"><h3>Admin login</h3>
<div class="row"><input id="key" type="password" placeholder="Admin key" autofocus></div>
<div class="row"><button id="loginBtn" style="flex:1">Sign in</button></div><div id="lerr" class="mut"></div></div></div>

<header><h1>Frost Admin</h1>
<input id="bcast" placeholder="Global chat / broadcast..." style="width:260px">
<button class="sec" id="say">Say in chat</button>
<button class="sec" id="msgAll">Overlay to all</button>
<button class="sec" id="logout">Log out</button></header>

<main>
<div class="card col" style="overflow:hidden">
  <input id="search" placeholder="Search players...">
  <div id="list"></div>
</div>

<div class="col">
  <div class="card"><h3>Selected player</h3><div id="who" class="mut">Pick a player on the left.</div></div>
  <div class="grid">
    <div class="card"><h3>Gift</h3>
      <div class="row"><select id="gkind"><option value="item">Template ID</option><option value="hero">Hero</option><option value="schematic">Schematic</option><option value="resource">Resource</option><option value="llama">Llama</option></select>
      <input id="gval" placeholder="e.g. Hero:HID_... / commando"><input id="gqty" type="number" value="1" min="1" style="max-width:80px"></div>
      <button data-a="gift">Send gift</button></div>
    <div class="card"><h3>Progress</h3>
      <div class="row"><input id="amt" type="number" min="1" placeholder="Amount"></div>
      <div class="row"><button data-a="xp">+XP</button><button data-a="stars">+Stars</button><button data-a="level" class="sec">Set level</button><button data-a="points" class="sec">+Skill pts</button></div>
      <div class="row"><input id="qid" placeholder="Quest ID"><button data-a="completequest" class="sec">Complete</button></div>
      <button data-a="resetquests" class="sec">Reset quests</button></div>
    <div class="card"><h3>Moderation</h3>
      <div class="row"><input id="reason" placeholder="Ban reason"></div>
      <div class="row"><button data-a="ban" class="bad">Ban</button><button data-a="unban" class="sec">Unban</button></div>
      <div class="row"><input id="mtext" placeholder="Message text"></div>
      <div class="row"><button data-a="message" class="sec">Overlay (3s)</button><button data-a="notify" class="sec">Notify</button></div>
      <div class="row"><input id="disc" placeholder="Discord ID"></div>
      <div class="row"><button data-a="setdiscord" class="sec">Link Discord</button><button data-a="cleardiscord" class="sec">Unlink</button></div></div>
  </div>
  <div class="card"><h3>Quests &amp; level</h3><div id="prog" class="mut">-</div></div>
  <div class="card"><h3>Console</h3><div id="log"></div>
    <div class="row" style="margin-top:8px"><input id="raw" placeholder="Raw command, e.g. accounts   (same as the server window)"><button id="runRaw" style="flex:0">Run</button></div></div>
</div>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let accounts=[],sel=null;

async function api(p,body){
  const r=await fetch("/admin/api/"+p,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","X-Admin-Panel":"1"},body:body?JSON.stringify(body):undefined});
  if(r.status===401){$("#login").style.display="grid";throw new Error("unauthorized")}
  return r.json();
}
function log(t){const l=$("#log");l.textContent+=t+"\n";l.scrollTop=l.scrollHeight}

async function boot(){
  try{await api("me");$("#login").style.display="none";await loadAccounts()}catch(e){}
}
$("#loginBtn").onclick=async()=>{
  const r=await fetch("/admin/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:$("#key").value})});
  const j=await r.json();
  if(j.ok){$("#key").value="";boot()}else $("#lerr").textContent=j.error||"failed";
};
$("#key").onkeydown=e=>{if(e.key==="Enter")$("#loginBtn").click()};
$("#logout").onclick=async()=>{await fetch("/admin/api/logout",{method:"POST",headers:{"X-Admin-Panel":"1"}});location.reload()};

async function loadAccounts(){accounts=(await api("accounts")).accounts||[];render()}
function render(){
  const f=$("#search").value.toLowerCase();
  $("#list").innerHTML=accounts.filter(a=>(a.displayName+a.accountId+a.email).toLowerCase().includes(f)).map(a=>
    `<div class="p ${sel&&sel.accountId===a.accountId?"sel":""}" data-id="${esc(a.accountId)}"><span>${esc(a.displayName)}</span><span>${a.online?'<span class="tag on">online</span>':""}${a.banned?'<span class="tag ban">banned</span>':""}</span></div>`).join("")||'<div class="mut">No players</div>';
}
$("#search").oninput=render;
$("#list").onclick=e=>{const el=e.target.closest(".p");if(!el)return;sel=accounts.find(a=>a.accountId===el.dataset.id);pick()};

async function pick(){
  render();
  $("#who").innerHTML=`<b>${esc(sel.displayName)}</b> <span class="mut">${esc(sel.accountId)} &middot; ${esc(sel.email)} &middot; Discord: ${esc(sel.discordId||"not linked")} &middot; HWIDs: ${sel.hwids}</span>`;
  const r=await api("progress/"+encodeURIComponent(sel.accountId));
  if(!r.ok){$("#prog").textContent=r.error||"no progress";return}
  $("#prog").innerHTML=`Level <b>${r.level}</b>/${r.maxLevel} &middot; XP ${r.xp}/${r.xpToNext} &middot; Stars ${r.battleStars.total} &middot; Matches ${r.matches} &middot; Wins ${r.lifetimeWins}`+
   `<table><tr><th>State</th><th>Quest</th><th>Progress</th><th></th></tr>`+r.quests.map(q=>
   `<tr><td>${esc(q.state)}</td><td>${esc(q.name)} <span class="mut">${esc(q.type)}</span></td><td>${q.objectives.map(o=>o.progress+"/"+o.count).join(" ")}</td><td><button class="sec" data-q="${esc(q.id)}">Complete</button></td></tr>`).join("")+`</table>`;
}
$("#prog").onclick=e=>{const id=e.target.dataset.q;if(id)act("completequest",{questId:id})};

async function act(action,extra){
  if(action==="say"||action==="questweek"||(action==="message"&&extra&&extra.user==="all")){}
  else if(!sel)return log("Select a player first.");
  if(action==="ban"&&!confirm("Ban "+sel.displayName+"?"))return;
  const r=await api("action",Object.assign({action,user:sel&&sel.accountId},extra||{}));
  log("> "+(r.line||"")+"\n"+(r.output||r.error||""));
  await loadAccounts();if(sel){sel=accounts.find(a=>a.accountId===sel.accountId)||sel;pick()}
}
document.querySelectorAll("button[data-a]").forEach(b=>b.onclick=()=>{
  const a=b.dataset.a;
  act(a,{kind:$("#gkind").value,value:$("#gval").value,qty:$("#gqty").value,amount:$("#amt").value,questId:$("#qid").value,
         reason:$("#reason").value,text:$("#mtext").value,discordId:$("#disc").value});
});
$("#say").onclick=()=>act("say",{text:$("#bcast").value});
$("#msgAll").onclick=()=>act("message",{user:"all",text:$("#bcast").value});
$("#runRaw").onclick=async()=>{const l=$("#raw").value.trim();if(!l)return;const r=await api("cmd",{line:l});log("> "+l+"\n"+(r.output||r.error||""));$("#raw").value=""};
$("#raw").onkeydown=e=>{if(e.key==="Enter")$("#runRaw").click()};
boot();
</script>
</body>
</html>

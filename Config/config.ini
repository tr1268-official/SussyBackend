[Matchmaker]
# Live queue + port-wait matchmaker (v1.11 era clients).
# While queued, clients receive refreshed "Queued" statuses with the REAL number of
# players queued for their playlist, and a session is only assigned once the game
# server port below (or the per-playlist override) is actually open.

# If false, the matchmaker assigns a session instantly (old behavior).
bWaitForPort=true
# How to detect the game server is hosting: tcp | udp | both | off
# UE dedicated servers (fortmp/rift/...) listen on UDP, TCP proxies on TCP.
# NOTE: Windows swallows UDP ICMP errors, so the udp probe is optimistic there;
# if players are never released with a UDP-only server, set probe=off.
probe=both
# How often (ms) the port is re-checked while players are queued.
checkIntervalMs=2000
# How often (ms) queued clients get a refreshed queue status.
statusIntervalMs=5000
# Probe timeout (ms).
probeTimeoutMs=1500
# Port the matchmaker WebSocket listens on (xmpp.js) — must match what clients use.
wsPort=80
# Per-playlist ip:port overrides (falls back to [GameServer]):
;Playlist_DefaultSolo=26.155.48.164:7777
;Playlist_DefaultDuo=26.155.48.164:7778
udpAssumeOpenOnTimeout=false
probeHost=26.155.48.164

